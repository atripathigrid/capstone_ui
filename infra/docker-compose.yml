# Local/dev parity. The frontend builds to static assets served by nginx.
# Backend + Postgres services are stubbed here for when the API lands (plan R5/R6).
services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: evoforge-portal-frontend
    ports:
      - "8080:80"
    restart: unless-stopped

