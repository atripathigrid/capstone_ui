# CI pipeline: install → typecheck → lint → build (plan Requirement 2).
# Move to .github/workflows/ to activate on GitHub.
name: frontend-ci

on:
  push:
    branches: [login_page, user_ui, admin_ui, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
