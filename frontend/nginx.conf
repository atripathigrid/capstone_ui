server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback so deep links (/registry/:id, /workflows/:id) and the
  # browser Back button resolve to the app instead of a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets are content-hashed → safe to cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
